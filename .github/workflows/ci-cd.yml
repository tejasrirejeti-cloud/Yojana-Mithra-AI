name: Enterprise Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Code Type Check
        run: npm run lint
      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

  unit-and-integration-tests:
    name: Unit & Integration Test Execution
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Execute Vitest Suite & Code Coverage
        run: npm test -- --coverage
      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  e2e-playwright-tests:
    name: End-to-End Playwright Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies & Playwright Browsers
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run E2E Tests
        run: npm run test:e2e

  docker-build-and-package:
    name: Build Production Container Image
    runs-on: ubuntu-latest
    needs: e2e-playwright-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Test Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: yojanamithra-ai:latest
